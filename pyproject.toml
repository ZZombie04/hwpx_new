[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hwpx-new"
version = "2.2.0"
description = "한글(HWPX) 서식을 분석해 같은 서식의 새 문서(HWPX + PDF)를 만들어 주는 도구 · CLI · MCP · AI 스킬"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ZZombie04" }]
keywords = ["hwpx", "hwp", "한글", "hancom", "mcp", "skill", "report", "공문서"]
dependencies = [
  "lxml>=4.9",
  "pymupdf>=1.23",
  "pillow>=9.0",
  "segno>=1.5",
]

[project.scripts]
hwpx-new = "hwpx_new.cli:main"
hwpx-new-mcp = "hwpx_new.mcp_server:main"

[project.urls]
Homepage = "https://github.com/ZZombie04/hwpx_new"

[tool.setuptools]
packages = ["hwpx_new"]

[tool.setuptools.package-data]
hwpx_new = ["FORMAT.md", "data/*.md", "data/*.hwpx"]
